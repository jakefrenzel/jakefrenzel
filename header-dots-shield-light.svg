<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <style>
    .tag { font: 600 13px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; fill: #0969da; letter-spacing: 3px; }
    .name { font: 700 56px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #1f2328; letter-spacing: -1px; }
    .role { font: 400 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #59636e; }
    .mark { font: 700 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f6f8fa; }
    .ring { fill: none; stroke: #0969da; stroke-width: 1.5; animation: ring 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { from { opacity: .7; transform: scale(.5); } to { opacity: 0; transform: scale(1.8); } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c3ccd5"/></pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="220" fill="url(#fade)"/></mask>
    <clipPath id="clip"><rect width="1200" height="220" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="220" fill="#f6f8fa"/>
    <rect width="1200" height="220" fill="url(#dots)" mask="url(#m)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="219" rx="12" fill="none" stroke="#d1d9e0"/>
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fe6"/>
      <stop offset="1" stop-color="#0858c6"/>
    </linearGradient>
    <clipPath id="half"><rect x="12" y="-2" width="14" height="28"/></clipPath>
    <filter id="soft" x="-40%" y="-30%" width="180%" height="170%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="1.1" flood-color="#0969da" flood-opacity=".28"/>
    </filter>
  </defs>
  <g transform="translate(40 50) scale(5)">
    <path d="M12 1.6 L3.6 5.2 V11 C3.6 16.3 7.2 21.2 12 22.6 C16.8 21.2 20.4 16.3 20.4 11 V5.2 Z" fill="url(#sg)" stroke="url(#sg)" stroke-width="1.6" stroke-linejoin="round" filter="url(#soft)"/>
    <path d="M12 1.6 L3.6 5.2 V11 C3.6 16.3 7.2 21.2 12 22.6 C16.8 21.2 20.4 16.3 20.4 11 V5.2 Z" fill="#000" stroke="#000" stroke-width="1.6" stroke-linejoin="round" opacity=".13" clip-path="url(#half)"/>
    
  </g>
  <text x="188" y="72" class="tag">CYBERSECURITY · GRAND CANYON UNIVERSITY</text>
  <text x="184" y="132" class="name">Jake Frenzel</text>
  <text x="188" y="170" class="role">Infrastructure &amp; Endpoint Security Intern · Summer 2026</text>
  <g fill="#0969da">
    <circle cx="970" cy="68" r="3"/><circle cx="1036" cy="134" r="4"/><circle cx="1102" cy="90" r="3"/><circle cx="1146" cy="178" r="3"/>
  </g>
  <circle class="ring" cx="1036" cy="134" r="14"/>
</svg>
